<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DEPLOYX architecture diagram</title>
  <desc id="desc">A diagram showing discovery, customer graph, compatibility, integration, deployment, release evidence, incident, and memory layers.</desc>
  <style>
    .ink { fill: #17211f; }
    .muted { fill: #56635d; }
    .accent { fill: #a13e1b; }
    .panel { fill: #fcfbf7; stroke: #7d8a82; stroke-width: 2; }
    .soft { fill: #f6f5f0; stroke: #c2cbc2; stroke-width: 2; }
    .line { fill: none; stroke: #7d8a82; stroke-width: 3; }
    .label { font: 600 17px Aptos, Segoe UI, sans-serif; fill: #56635d; }
    .small { font: 14px SFMono-Regular, Cascadia Code, monospace; fill: #56635d; }
    .heading { font: 700 24px Georgia, serif; fill: #17211f; }
  </style>
  <rect width="1600" height="900" fill="#eceee8"/>
  <rect x="44" y="44" width="1512" height="812" rx="22" class="panel"/>
  <text x="92" y="108" class="heading">DEPLOYX / deployment operations architecture</text>
  <text x="92" y="142" class="label">A single operating surface for discovery, integration, promotion, and response.</text>
  <rect x="92" y="200" width="300" height="184" rx="14" class="soft"/>
  <text x="120" y="238" class="label">DISCOVERY</text>
  <text x="120" y="278" class="heading">Environment graph</text>
  <text x="120" y="310" class="small">cloud / data / identity / SaaS</text>
  <text x="120" y="342" class="small">typed resources + dependencies</text>
  <rect x="452" y="200" width="300" height="184" rx="14" fill="#f7e5dc" stroke="#a13e1b" stroke-width="2"/>
  <text x="480" y="238" class="label">CUSTOMER GRAPH</text>
  <text x="480" y="278" class="heading">Blast radius</text>
  <text x="480" y="310" class="small">blast-radius visibility</text>
  <text x="480" y="342" class="small">field + API evidence</text>
  <rect x="812" y="200" width="300" height="184" rx="14" class="soft"/>
  <text x="840" y="238" class="label">COMPATIBILITY</text>
  <text x="840" y="278" class="heading">Preflight engine</text>
  <text x="840" y="310" class="small">network / IAM / schema</text>
  <text x="840" y="342" class="small">blocking checks + remediation</text>
  <rect x="1172" y="200" width="300" height="184" rx="14" class="soft"/>
  <text x="1200" y="238" class="label">INTEGRATION</text>
  <text x="1200" y="278" class="heading">Adapter studio</text>
  <text x="1200" y="310" class="small">canonical mappings</text>
  <text x="1200" y="342" class="small">runtime policies + evidence</text>
  <path d="M392 292H452" class="line"/><path d="M752 292H812" class="line"/><path d="M1112 292H1172" class="line"/>
  <path d="M1320 384V456H240V384" class="line"/>
  <rect x="92" y="456" width="300" height="184" rx="14" class="soft"/>
  <text x="120" y="494" class="label">DEPLOYMENT</text>
  <text x="120" y="534" class="heading">Canary composer</text>
  <text x="120" y="566" class="small">1 / 5 / 25 / 50 / 100%</text>
  <text x="120" y="598" class="small">rollback threshold</text>
  <rect x="452" y="456" width="300" height="184" rx="14" class="soft"/>
  <text x="480" y="494" class="label">RELEASE EVIDENCE</text>
  <text x="480" y="534" class="heading">Evidence plane</text>
  <text x="480" y="566" class="small">release / boundary context</text>
  <text x="480" y="598" class="small">recorded release state</text>
  <rect x="812" y="456" width="300" height="184" rx="14" fill="#f4e8cd" stroke="#a86e10" stroke-width="2"/>
  <text x="840" y="494" class="label">INCIDENT</text>
  <text x="840" y="534" class="heading">FDE workspace</text>
  <text x="840" y="566" class="small">evidence-backed hypotheses</text>
  <text x="840" y="598" class="small">human-controlled response</text>
  <rect x="1172" y="456" width="300" height="184" rx="14" class="soft"/>
  <text x="1200" y="494" class="label">MEMORY</text>
  <text x="1200" y="534" class="heading">Deployment patterns</text>
  <text x="1200" y="566" class="small">playbooks + known failures</text>
  <text x="1200" y="598" class="small">reusable validation</text>
  <path d="M392 548H452" class="line"/><path d="M752 548H812" class="line"/><path d="M1112 548H1172" class="line"/>
  <path d="M1320 640V716H240V640" class="line"/>
  <rect x="92" y="716" width="1380" height="88" rx="14" fill="#17211f"/>
  <text x="130" y="754" font-family="Aptos, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Safety boundary</text>
  <text x="130" y="781" font-family="Aptos, sans-serif" font-size="15" fill="#c2cbc2">The current repository is simulation-first. It does not connect to customer infrastructure or execute deployments.</text>
  <text x="92" y="842" class="small">ORIGINAL PRODUCT DIAGRAM / DEPLOYX OPEN SOURCE</text>
</svg>
