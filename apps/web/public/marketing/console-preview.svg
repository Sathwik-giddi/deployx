  <circle cx="1320" cy="626" r="12" fill="#f7e5dc" stroke="#a13e1b" stroke-width="2"/><text x="1320" y="631" text-anchor="middle" font-family="Aptos" font-size="10" font-weight="800" class="accent">04</text>
  <text x="1080" y="669" class="small">Preflight</text><text x="1160" y="669" class="small">Remediate</text><text x="1240" y="669" class="small">Gate</text><text x="1320" y="669" class="small">Canary</text>
