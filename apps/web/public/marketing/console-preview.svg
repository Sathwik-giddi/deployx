    .panel { fill: #fcfbf7; stroke: #7d8a82; stroke-width: 1.5; }
    .soft { fill: #f6f5f0; stroke: #c2cbc2; stroke-width: 1.5; }
    .rule { stroke: #c2cbc2; stroke-width: 1.5; }
    .label { font: 600 13px Aptos, Segoe UI, sans-serif; fill: #56635d; }
    .small { font: 12px SFMono-Regular, Cascadia Code, monospace; fill: #56635d; }
    .body { font: 14px Aptos, Segoe UI, sans-serif; fill: #56635d; }
    .title { font: 700 29px Georgia, serif; fill: #17211f; }
