name: deployx-acme-lab

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-acme_lab}"
      POSTGRES_USER: "${POSTGRES_USER:-acme}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-only-postgres}"
      POSTGRES_INITDB_ARGS: "--data-checksums=1"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - acme-lab

  mysql:
    image: mysql:8.4.3
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: "acme_lab"
      MYSQL_USER: "${MYSQL_USER:-acme}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-local-only-mysql}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-only-root}"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - acme-lab

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - acme-lab

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9093},INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks:
      - acme-lab

  mock-salesforce:
    image: python:3.12.8-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/mock_service.py"]
    environment:
      SERVICE_NAME: "salesforce"
      PORT: "8080"
      FAULT_MODE: "${MOCK_FAULT_MODE:-healthy}"
      FAULT_DELAY_SECONDS: "${MOCK_FAULT_DELAY_SECONDS:-5}"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${SALESFORCE_PORT:-8080}:8080"
    volumes:
      - ./mock-services/mock_service.py:/app/mock_service.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - acme-lab

  mock-okta:
    image: python:3.12.8-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/mock_service.py"]
    environment:
      SERVICE_NAME: "okta"
      PORT: "8080"
      FAULT_MODE: "${MOCK_FAULT_MODE:-healthy}"
      FAULT_DELAY_SECONDS: "${MOCK_FAULT_DELAY_SECONDS:-5}"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${OKTA_PORT:-8081}:8080"
    volumes:
      - ./mock-services/mock_service.py:/app/mock_service.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - acme-lab

networks:
  acme-lab:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  kafka_data:
